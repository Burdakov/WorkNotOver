scenarios:
  - name: "base_case"
    description: "Базовый прогноз с текущими режимами"
    forecast_start_date: "2024-01-01"
    forecast_end_date: "2028-12-31"
    injection_multipliers:
      default: 1.0
    producer_constraints:
      default_liquid_rate_multiplier: 1.0

  - name: "increase_injection_20pct"
    description: "Увеличение закачки на 20% по всем нагнетательным"
    forecast_start_date: "2024-01-01"
    forecast_end_date: "2028-12-31"
    injection_multipliers:
      default: 1.2
    producer_constraints:
      default_liquid_rate_multiplier: 1.0

  - name: "screen_suspected_channel"
    description: "Проверка сценария экранирования предполагаемого канала INJ_001 -> PROD_002"
    forecast_start_date: "2024-01-01"
    forecast_end_date: "2028-12-31"
    link_changes:
      - injector_id: "INJ_001"
        producer_id: "PROD_002"
        active: true
        link_type: "screen"
        eta_multiplier: 0.5
    injection_multipliers:
      default: 1.0
