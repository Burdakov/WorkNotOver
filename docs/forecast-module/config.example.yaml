project:
  name: "waterflood_proxy_hm_example"
  random_seed: 42
  language: "ru"

coordinates:
  crs: "EPSG:32640"
  x_unit: "m"
  y_unit: "m"
  allow_latlon: false

units:
  pressure: "bar"
  rate_surface_liquid: "m3/day"
  rate_surface_gas: "sm3/day"
  volume_surface_liquid: "m3"
  volume_reservoir: "rm3"
  distance: "m"
  viscosity: "cP"

geometry_initializer:
  enabled: true
  influence_radius_m: 3000.0
  distance_kernel: "power_cutoff"
  distance_power: 2.0
  gaussian_beta: 2.0
  inverse_power: 2.0
  min_distance_m: 10.0
  connect_nearest_if_empty: false
  create_inactive_outside_radius: true

link_type_multipliers:
  screen: 0.2
  normal: 1.0
  channel: 2.5
  unknown: 1.0

link_type_tau_multipliers:
  screen: 2.5
  normal: 1.0
  channel: 0.4
  unknown: 1.0

link_type_pv_multipliers:
  screen: 1.5
  normal: 1.0
  channel: 0.5
  unknown: 1.0

link_type_breakthrough_ipvi_multipliers:
  screen: 1.5
  normal: 1.0
  channel: 0.5
  unknown: 1.0

edge_pv_initializer:
  method: "corridor"
  default_phi: 0.20
  default_ntg: 0.75
  default_h_m: 10.0
  default_corridor_width_m: 300.0
  prefer_cell_pv_if_available: true
  prefer_mrst_volume_if_available: true

edge_displacement:
  fractional_flow_source: "tabular_scal"
  fallback_to_corey: false
  use_pressure_dependent_viscosity: true
  representative_pressure_mode: "cell_pressure"
  initial_displacement_efficiency: 0.75
  default_breakthrough_ipvi: 0.35

tau_initializer:
  tau_min_days: 10.0
  front_velocity_prior_m_per_day: 5.0

prior_blending:
  distance_weight: 0.60
  mrst_weight: 0.25
  crm_weight: 0.15
  manual_weight: 1.00
  manual_overrides_automatic: true
  redistribute_missing_source_weights: true

properties:
  mode: "deck_or_normalized_tables"
  require_for_production: true
  allow_synthetic_defaults: false

  import:
    prefer_opm_deck: true
    deck_path: "data/model.DATA"
    props_include_paths:
      - "data/properties/pvt.inc"
      - "data/properties/rock.inc"
      - "data/properties/satfunc.inc"
    normalized_tables_dir: "data/properties"

  active_phases:
    oil: true
    water: true
    gas: false

  regions:
    require_pvtnum: true
    require_satnum: true
    require_rocknum: true
    default_region_allowed_if_single_region: true

  interpolation:
    method: "linear"
    extrapolation: "error"
    log_extrapolation: true

  oil_pvt:
    accepted_keywords:
      - "PVTO"
      - "PVDO"
    require_rs_for_live_oil: true
    derive_pb_from_pvto: true

  water_pvt:
    accepted_keywords:
      - "PVTW"
    require_water_compressibility: true
    require_water_viscosity: true

  gas_pvt:
    accepted_keywords:
      - "PVDG"
      - "PVTG"
    required_if_gas_active: true

  density:
    accepted_keywords:
      - "DENSITY"
    require_surface_densities: true

  rock:
    accepted_keywords:
      - "ROCK"
    require_rock_compressibility_for_pressure: true

  scal:
    accepted_oil_water_sets:
      - ["SWOF"]
      - ["SWFN", "SOF2"]
      - ["SWFN", "SOF3"]
    accepted_gas_oil_sets:
      - ["SGOF"]
      - ["SGFN", "SOF3"]
    require_for_watercut_model: true
    allow_corey_only_for_synthetic: true

material_balance:
  mode: "black_oil_tank"
  use_pressure_dependent_pvt: true
  use_rock_compressibility: true
  use_water_compressibility: true
  use_region_specific_properties: true
  pressure_unknown: "p_res"
  solve_pressure_iteratively: true
  max_pressure_iterations: 20
  pressure_tolerance: 0.01
  include_intercell_flux: false
  include_aquifer_support: false

calibration:
  enabled: true
  normalize_alpha_by_injector: true
  allow_alpha_override_distance_prior: true
  allow_eta_edge_level: true
  train_start_date: "2018-01-01"
  train_end_date: "2022-12-31"
  validation_start_date: "2023-01-01"
  validation_end_date: "2023-12-31"

  objective_weights:
    watercut: 5.0
    pressure: 3.0
    rates: 1.0
    material_balance: 1.0
    regularization: 1.0

  regularization:
    alpha_prior_weight: 1.0
    link_type_prior_weight: 2.0
    eta_smoothness_weight: 0.2
    property_multiplier_weight: 5.0

  bounds:
    alpha_min: 0.0
    alpha_max: 1.0
    eta_min: 0.0
    eta_max: 1.5
    tau_min_days: 1.0
    tau_max_days: 3000.0
    pv_multiplier_min: 0.1
    pv_multiplier_max: 10.0
    displacement_efficiency_min: 0.1
    displacement_efficiency_max: 1.5
    pressure_multiplier_min: 0.2
    pressure_multiplier_max: 5.0

  optimizer:
    method: "scipy_least_squares"
    max_iterations: 500
    multi_start: 10
    tolerance: 1.0e-6

adapters:
  opm:
    enabled: false
    flow_executable: "flow"
    deck_path: "data/model.DATA"
    results_dir: "opm_results"
  mrst:
    enabled: false
    export_csv_dir: "data/mrst_exports"
  pywaterflood:
    enabled: false
    use_crm_priors: true
    use_buckley_leverett_when_compatible: true

reporting:
  language: "ru"
  plots:
    watercut: true
    pressure: true
    alpha_heatmap: true
    eta: true
    link_type_diagnostics: true
    pvt: true
    scal: true
