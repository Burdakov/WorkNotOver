services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worknotover
      POSTGRES_USER: worknotover
      POSTGRES_PASSWORD: worknotover
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      - db
    volumes:
      - ./backend/storage:/app/storage
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://worknotover:worknotover@db:5432/worknotover}
    ports:
      - "${BACKEND_PORT:-8010}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5180}:80"

volumes:
  postgres_data:
