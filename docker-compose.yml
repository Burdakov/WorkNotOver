services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend/storage:/app/storage
    ports:
      - "${BACKEND_PORT:-8010}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5180}:80"